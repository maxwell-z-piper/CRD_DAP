[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crd-dap"
version = "0.0.1"
description = "Likelihood-preserving KCWI/KCRM analysis pipeline for counter-rotating stellar disks"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Maxwell Piper"}]
dependencies = [
    "numpy",
    "scipy",
    "astropy",
    "matplotlib",
]

[project.optional-dependencies]
science = [
    "ppxf",
    "powerbin",
]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["crd_utils*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
